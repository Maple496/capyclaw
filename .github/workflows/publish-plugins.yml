name: Publish dsh plugins

# 两条分发路径都走这里：
#   1) zip 源（tools/plugin-release）：打 plugins/*.zip + index.json，并自证
#   2) npm 包（scripts/publish-to-npm.mjs）：直接发布原始包目录
#
# 如果目标只是让 GitHub Release 附带 zip，把 npm 两步删掉即可。

on:
  push:
    tags:
      - 'capyclaw-*-v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview only)'
        required: false
        default: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # 测试失败必须中断发布：此前这里是 `|| true`，等于没有门槛
      - name: Validate plugins
        run: npm run validate-all

      - name: Test plugins
        run: npm run test-all

      - name: Pack plugin zips
        run: node tools/plugin-release/bin/cli.mjs release --all

      - name: Build index
        run: node tools/plugin-release/bin/cli.mjs index

      - name: Verify packed source
        run: node tools/plugin-release/bin/cli.mjs verify dist

      - name: Publish to npm (dry run)
        if: github.event.inputs.dry_run != 'false'
        run: node scripts/publish-to-npm.mjs --dry-run

      - name: Publish to npm
        if: github.event.inputs.dry_run == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-to-npm.mjs --execute

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zips
          path: |
            dist/plugins/*.zip
            dist/index.json
          retention-days: 30

      - name: Attach zips to GitHub Release
        if: github.event_name == 'push' && github.event.inputs.dry_run == 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/plugins/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
