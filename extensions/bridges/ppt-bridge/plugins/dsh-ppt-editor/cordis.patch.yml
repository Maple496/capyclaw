# PPT 编辑器插件配置
# 注册到 DeepSeek Harness

- insert:
    # 主插件
    - id: ppt-editor-host
      name: dsh-ppt-editor
      config:
        autoOpenSidebar: true
        defaultTemplate: professional
        maxSlides: 50
    
