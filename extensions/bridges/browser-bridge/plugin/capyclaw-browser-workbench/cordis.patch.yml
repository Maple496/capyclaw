# @capyclaw/browser-workbench patch：服务解耦标准下只保留 dsh 侧的 MCP 接入行。
#
# 本包主体（relay：/mcp + 工作台静态页 + /api）是**独立端口服务**，
# 不 insert 进 dsh 进程——由 dsh-service-broker 按清单以独立进程拉起
# （standalone 入口：node server/relay.mjs [--port 39315] [--dir <hostDir>]，
# dsh-service-host 骨架：/healthz 带 pid、单实例锁、优雅关闭）。
# 服务规格（browser-suite services.json 片段）：
#   { "id": "browser-workbench",
#     "cmd": ["node", "<本包>/server/relay.mjs", "--port", "${PORT}"],
#     "ports": { "main": 39315 },
#     "url": "http://127.0.0.1:${PORT}" }
#
# mcp-browser：官方 mcp-client 以 streamable-http 连本机 relay 的 /mcp。
# 纯静态 URL，无路径、无 !!js——装到任何机器都是同一份 patch。
# failOnStartupError:false：relay 由中间件拉起，就绪前连接失败只降级为
# 工具暂不可用（reconnect 会追上），不阻塞启动。
- insert:
    - id: mcp-browser
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: browser
        transport: streamable-http
        url: 'http://127.0.0.1:39315/mcp'
        failOnStartupError: false
        toolCallTimeoutMs: 120000
