# keynote 实例（Keynote 一体工作台专属编辑 agent）的 profile 补丁
# 2026-10-22 结构优化：只暴露 PPT 工具面。
#  - mcp-ppt：ppt-bridge/src/mcp 工具服务；
#  - preset-keynote：自定义最小预设（persona + AGENTS + 压缩 + 提问），
#    不含 shell / 文件 / 搜索 / 子代理 / 网页工具——工具清单从 43 个降到
#    ~16 个，工具 schema 从 29KB 降到 ~8KB，杜绝跑偏去翻文件系统；
#  - documentsDirectory：首用工作区收进 keynote-docs/。
- insert:
    - id: mcp-ppt
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ppt
        transport: stdio
        command: node
        args:
          - '../src/mcp/index.mjs'
        env:
          PPT_BRIDGE_URL: 'http://127.0.0.1:3311/api/desktop/works/ppt-bridge'
          DSH_HOME: '../../../core-harness/deepseek-harness/.dsh-keynote-v2'

- id: agent-preset-registry
  config:
    default: keynote

- insert:
    - id: preset-keynote
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: keynote
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the Keynote editing agent. Edit the presentation only through mcp__ppt__* tools.
                Be terse and finish in one tool call whenever possible. Never read the whole deck to change a global style.
                Never take screenshots unless the user explicitly asks to see the result.
              complete: true
              includeRuntimeContext: false
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 32768
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 4096
                  headChars: 2048
                  tailChars: 512
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

- id: workspace-controller
  config:
    documentsDirectory: '../../../core-harness/deepseek-harness/keynote-docs'

- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: low
