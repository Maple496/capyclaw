<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPT 工作台 · dsh-ppt-workbench</title>
<style>
  :root {
    --bg: #1c1e22; --panel: #24262b; --win: #2b2e34; --line: #3a3d45;
    --txt: #e8eaed; --txt2: #9aa0a8; --ok: #4caf7d; --wait: #d19a3d;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--txt);
    font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: var(--win); border-bottom: 1px solid var(--line);
  }
  header .title { font-weight: 600; }
  [data-badge] {
    flex: none; font-size: 11.5px; padding: 1px 8px; border-radius: 10px;
    color: #fff; background: var(--txt2);
  }
  [data-badge="ok"] { background: var(--ok); }
  [data-badge="wait"] { background: var(--wait); }
  [data-note] {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--txt2); font-size: 12px;
  }
  .bar { display: flex; gap: 6px; align-items: center; flex: none; }
  input[data-quick] {
    width: 280px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px;
    font-size: 12px; background: var(--panel); color: var(--txt); outline: none;
  }
  input[data-quick]:focus { border-color: #5b9bd5; }
  button {
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px;
    background: var(--panel); color: var(--txt); font-size: 12px; cursor: pointer;
  }
  button:hover { border-color: #5b9bd5; }
  main { flex: 1; min-height: 0; position: relative; background: var(--panel); }
  [data-editor] { position: absolute; inset: 0; }
  [data-veil] {
    position: absolute; inset: 0; background: var(--panel);
    display: grid; place-items: center; text-align: center;
    color: var(--txt2); font-size: 13px; transition: opacity .25s; pointer-events: none;
  }
  [data-veil] .hint { color: var(--txt2); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <span class="title">PPT 工作台</span>
  <span data-badge>连接中…</span>
  <span data-note></span>
  <div class="bar">
    <input data-quick title="本地直改，不走 AI：背景<颜色> / 第N页标题改成X / 加一页 X"
           placeholder="⚡ 背景改成白色 / 第2页标题改成X / 加一页 X">
    <button data-act="quick">执行</button>
    <button data-act="pptx" title="导出 .pptx">导出 PPTX</button>
    <button data-act="json" title="导出 JSON">JSON</button>
    <button data-act="present">放映</button>
    <button data-act="exit-present">退出放映</button>
  </div>
</header>
<main>
  <div data-editor></div>
  <div data-veil>
    <div>
      <div data-editor-note>正在装载编辑器…</div>
      <div class="hint">在 DeepSeek Harness 会话里让 AI 做 PPT，改动会实时出现在这里</div>
    </div>
  </div>
</main>
<script src="./app.js"></script>
</body>
</html>
