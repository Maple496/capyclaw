    - id: browser-skill-browser
      name: "@capyclaw/browser-skill-browser"
    - id: browser-skill-api
      name: "@capyclaw/browser-skill-api"
    - id: browser-skill-ops
      name: "@capyclaw/browser-skill-ops"
