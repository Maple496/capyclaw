<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#E0E5EC">
    <title>Site</title>
    <script>
        /* 站点实例身份（2026-10-27 命名治理）：前端零品牌字面量。真源 =
           后端 app/settings.py::SiteConfig（.env 的 SITE_* 三行），经
           /config.json site 块下发；本脚本先以主机名首段做同步占位
           （ddr0.com → ddr0，同步供 <title> 与首帧使用），config 落定后
           由后置脚本校正为实例数据。存储键派生消费面 = theme.ts（主题
           cookie）/ chat-history-cache.ts（IndexedDB）/ community-view.ts
           （sessionStorage）。 */
        var __hostSlug = (location.hostname.replace(/^www\./, '').split('.')[0] || 'site');
        window.__SITE__ = { slug: __hostSlug, name: '', domain: '', recharge_work_ref: '' };
        document.title = __hostSlug;
        /* 启动里程碑打点：各阶段调 __fwMark(k)，随 interact boot-probe 的
           marks 字段上报（data/boot-probes.jsonl）——「拿到 HTML 后慢在哪
           一段」的直读面。必须在最先执行的脚本里定义。 */
        window.__fwBootMarks = [];
        window.__fwMark = function (k) {
            try {
                window.__fwBootMarks.push({ k: String(k).slice(0, 24), t: Math.round(performance.now()) });
            } catch (e) { /* 打点失败不碍业务 */ }
        };
        window.__fwMark('html-head');
    </script>
    <!-- 首帧主题缓存（2026-10-20）：服务端在登录 / /api/auth/me / 主题 PUT 时
         刷新非 HttpOnly 的 <SITE_SLUG>_theme cookie（键名由实例数据派生，
         2026-10-27 命名治理）；这里在 CSS/首绘前同步把 <html data-theme>
         定到上次服务端下发的值，避免「先白后黑」。本脚本先于 /config.json
         落定执行，故按「*_theme 后缀」匹配而不依赖 slug 已知。
         运行期唯一写点仍是 runtime/shared/theme.ts；本脚本只做首帧预置。 -->
    <script>
        (function () {
            var m = (document.cookie.match(/(?:^|;\s*)[a-z0-9_-]+_theme=(light|dark)(?:;|$)/i) || [])[1];
            if (!m) {
                try {
                    /* sessionStorage 兜底同理按后缀匹配（Safari ITP 拒 cookie 场景） */
                    for (var i = 0; i < sessionStorage.length; i++) {
                        var k = sessionStorage.key(i);
                        if (k && /[a-z0-9_-]+_theme$/i.test(k)) {
                            var v = sessionStorage.getItem(k);
                            if (v === 'light' || v === 'dark') { m = v; }
                            break;
                        }
                    }
                } catch (e) { /* ignore */ }
            }
            var dark = m === 'dark';
            var root = document.documentElement;
            root.setAttribute('data-theme', dark ? 'dark' : 'light');
            root.style.colorScheme = dark ? 'dark' : 'light';
            /* 在 118KB 内联 CSS 解析完之前先给画布上底色：浏览器默认白底会
               在慢网/大 CSS 下露出一下，这是「闪白」的剩余来源。 */
            root.style.backgroundColor = dark ? '#1A1A1A' : '#E0E5EC';
            if (dark) {
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', '#1A1A1A');
            }
            window.__fwMark && window.__fwMark('theme-boot');
        })();
    </script>
    <!-- 引导幕布首帧主题响应：让 loading screen 在大 CSS 加载前就跟随 data-theme，
         消除「闪白」（#fwBootGate 的 var(--neu-bg) fallback 是浅色）。 -->
    <style>
        [data-theme="dark"] #fwBootGate { background: #1A1A1A; }
        [data-theme="dark"] .fw-boot-hint { background: #1A1A1A; color: #999; }
    </style>

<body>
    <!-- 应用挂载点 -->
    <div id="app">
        <!-- 引导幕布 -->
        <div id="fwBootGate" aria-busy="true" style="position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:var(--neu-bg,#E0E5EC);pointer-events:none;opacity:1;">
            <div class="fw-boot-hint" style="padding:18px 34px;border-radius:24px;box-shadow:var(--neu-raise);background:var(--neu-bg);color:var(--text-muted,#666);font-size:14px;letter-spacing:.08em;animation:fw-boot-pulse 1.6s ease-in-out infinite;">
                正在加载...
            </div>
        </div>
    </div>

    <!-- 15s 强制放行保险丝 -->
    <script>
        (function () {
            setTimeout(function () {
                if (window.Interact && typeof Interact.forceArm === 'function') {
                    Interact.forceArm();
                } else {
                    var g = document.getElementById('fwBootGate');
                    if (g && g.parentNode) g.parentNode.removeChild(g);
                }
                (window.__fwBeacon || function () {})(
                    'res', 'boot gate 15s 强制放行（交互层未就绪）', '');
            }, 15000);
        })();
    </script>

    <style>
        @keyframes fw-boot-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .55; }
        }
    </style>

    <!-- 错误信标 -->
    <script>
        (function () {
            var q = [], sent = 0;
            function push(k, m, s) {
                if (q.length >= 10) return;
                q.push({ k: k, m: String(m == null ? '' : m).slice(0, 400),
                         s: String(s || '').slice(0, 300), u: location.pathname.slice(0, 200) });
            }
            function flush() {
                if (!q.length || sent >= 3) return;
                sent++;
                var body = JSON.stringify({ items: q.splice(0, q.length) });
                try {
                    // 前缀读当值的 __apiBaseUrl：flush 在错误后 800ms，分离部署
                    // 下前置探测（本页更靠后的脚本）通常已落定；未落定则按同源
                    // 兜底，该条遥测丢失可接受
                    fetch((window.__apiBaseUrl || '') + '/api/client-errors', { method: 'POST', keepalive: true,
                        headers: { 'Content-Type': 'application/json',
                                   'X-Requested-With': 'XMLHttpRequest' },
                        body: body }).catch(function () {});
                } catch (e) {}
            }
            var prevErr = window.onerror;
            window.onerror = function (m, s, l, c) {
                if (typeof prevErr === 'function') { try { prevErr.apply(this, arguments); } catch (e) {} }
                push('js', m, (s || '') + ':' + (l || 0) + ':' + (c || 0));
                setTimeout(flush, 800);
                return false;
            };
            window.addEventListener('unhandledrejection', function (e) {
                var r = e.reason;
                push('rej', (r && (r.stack || r.message)) || r, '');
                setTimeout(flush, 800);
            });
            window.__fwBeacon = push;
        })();
    </script>

    <!-- CSRF fetch 包装器 + 接口域统一收口 -->
    <script>
        (function () {
            const origFetch = window.fetch;
            window.fetch = function (input, init) {
                // 2026-10-18 跨域分离部署统一收口（单点修好全部相对请求）：
                // (a) 相对 /api/ 请求补 __apiBaseUrl 前缀（已前缀成 API 域的
                //     绝对 URL 不动——判断 origin 仍是页面源才算未前缀）；
                // (b) /api/ 请求默认 credentials:'include'（跨源 fetch 默认
                //     不带 cookie；同源 include 行为不变；调用方显式设置优先）；

    <!-- 接口域前置探测（2026-10-18 接口层改造 + 2026-10-31 单文件跨域增强）：
         前端不关心后端在哪。三层兜底：
         1. 预注入全局变量（window.__DDR0_API_OVERRIDE，file:// / Electron 用）
         2. URL query 参数（?api=https://ddr0.com，直接打开/分享链接用）
         3. 相对 /config.json（同域/反向代理部署，既有行为零漂移）
         第一/二层只确定「后端在哪」，站点身份（品牌名等）仍要向后端要：
         命中后并行拉 <base>/config.json 的 site 块，否则跨域外壳会一直显示
         主机名占位（file:// 下就是字面量 site = 用户看到的「旧名称」）。
         先于一切模块求值；site-utils 的 api()/apiUrl() 等 __apiReady 落定
         后才发首个请求，auth.ts 等早序模块的启动请求不会以相对路径打错域。 -->
    <script>
        (function () {
            var resolveReady;
            window.__apiReady = new Promise(function (r) { resolveReady = r; });
            window.__apiBaseUrl = '';

            /* 站点实例身份校正（真源 = 后端 settings.site）：首帧的主机名
               占位升级为实例数据；跨域时也从 <base>/config.json 取。 */
            function applyConfig(cfg) {
                if (cfg && typeof cfg.apiBaseUrl === 'string') {
                    window.__apiBaseUrl = cfg.apiBaseUrl.replace(/\/+$/, '');
                }
                if (cfg && cfg.site && typeof cfg.site === 'object') {
                    window.__SITE__ = {
                        slug: String(cfg.site.slug
                                     || (window.__SITE__ && window.__SITE__.slug)
                                     || 'site'),
                        name: String(cfg.site.name || ''),
                        domain: String(cfg.site.domain || ''),
                        recharge_work_ref: String(cfg.site.recharge_work_ref || '')

                    if (window.__SITE__.name) document.title = window.__SITE__.name;
                }
            }

            /* 探测请求必须有上限：链路卡住时 fetch 可以挂几十秒，而全站
               首个 API 请求都在等 __apiReady——不设超时 = 整页一直白屏。 */

                    .catch(function () { return null; })

                        if (timer) clearTimeout(timer);
                        return cfg;
                    });
            }

               站点身份取后端域，取不到也不阻塞启动。 */

                window.__apiBaseUrl = window.__DDR0_API_OVERRIDE.replace(/\/+$/, '');
                resolveReady(window.__apiBaseUrl);
                probeFetch(window.__apiBaseUrl + '/config.json').then(applyConfig);
                return;
            }

            /* 第二层：URL query 参数 ?api=https://... */
            try {
                var params = new URLSearchParams(location.search);
                var qApi = params.get('api');
                if (qApi && typeof qApi === 'string' && qApi.trim()) {
                    window.__apiBaseUrl = qApi.trim().replace(/\/+$/, '');
                    resolveReady(window.__apiBaseUrl);
                    probeFetch(window.__apiBaseUrl + '/config.json').then(applyConfig);
                    return;
                }
            } catch (e) { /* URLSearchParams 不可用时跳过 */ }

            probeFetch('/config.json').then(function (cfg) {

    <!-- 首屏并行预取（2026-10-20）：bootstrap 与收藏第一页在 head 就发起，
         与 HTML 下载 / 主模块解析并行；boot.ts / my-favorites.ts 只 await
         结果，不再等模块求值完才发请求。必须放在 fetch 收口器与接口域
         探测之后（复用前缀/凭据/CSRF 头）。fav 只在本视图路径预取，
         其余页面不发无用请求。 -->
    <script>
        (function () {
            function getJSON(url) {
                // Safari ITP 等场景下会话 cookie 可能被拒，认证实际靠
                // mobile-shell 写入 sessionStorage 的 token；head 预取早于
                // mobile-shell 装载，必须自己补同一个 X-Session-Token，
                // 否则 bootstrap 会以游客返回（主题/权限都错，随后被
                // /api/auth/me 纠正 = 先浅后深的闪一下）。
                // 存储键 = <slug>.sessionToken.v1（mobile-shell 单源）；按后缀
                // 匹配 + 旧键兜底，读错键 = 预取 403 → 白跑一次请求。
                var headers = { 'X-Requested-With': 'XMLHttpRequest' };
                try {
                    var token = '';
                    for (var i = 0; i < sessionStorage.length; i++) {
                        var k = sessionStorage.key(i);
                        if (k && /\.sessionToken\.v1$/.test(k)) {

                            break;
                        }

                    if (token) headers['X-Session-Token'] = token;

                   交给 boot.ts 的现场请求重试（两条独立连接）。 */
                var ctrl = typeof AbortController === 'function'
                    ? new AbortController() : null;
                var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 4000) : null;
                return fetch(url, { credentials: 'include', headers: headers,
                                    signal: ctrl ? ctrl.signal : undefined })
                    .then(function (res) { return res.ok ? res.json() : null; })
                    .catch(function () { return null; })
                    .then(function (data) {
                        if (timer) clearTimeout(timer);
                        return data;
                    });
            }
            var path = location.pathname;
            // favorites 预取只对持会话 cookie 的访客有价值（2026-10-28 请求
            // 效率审计：匿名装载白发 403，每次硬装载 -1 请求）；收藏接口
            // 需登录，无 session_token 必 403。
            var hasSession = document.cookie.indexOf('session_token=') !== -1;
            window.__fwBootPrefetch = {
                bootstrap: window.__apiReady.then(function () {
                    window.__fwMark && window.__fwMark('prefetch-start');
                    return getJSON('/api/bootstrap');
                }),
                favorites: (hasSession && (path === '/' || path === '/favorites'))
                    ? window.__apiReady.then(function () {
                        return getJSON('/api/my/favorites?limit=30&offset=0');
                    })
                    : null
            };
        })();
    </script>

/* ---------- 视频播放器（fwm-vid；铬件恒深色） ---------- */
/* 圆角恒 0（直边）——与详情顶图 .giv-img 全宽直边同一观感，不另起圆角语言 */
.fwm-vid{position:relative;width:100%;background:#000;border-radius:0;overflow:hidden;line-height:0;touch-action:pan-y;}
/* 内联高度上限对齐详情图 420px 档（vh 字面量被弹层高度闸禁止；全屏态用
   百分比——相对全屏元素本身，无需视口单位） */
.fwm-vid video{width:100%;max-height:480px;display:block;background:#000;}
.fwm-vid:fullscreen{border-radius:0;display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
.fwm-vid:fullscreen video{max-height:100%;max-width:100%;width:auto;height:auto;flex:none;}
.fwm-vid:-webkit-full-screen{border-radius:0;}
/* 中央播放键（暂停/结尾时显示） */
.fwm-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.fwm-bigplay{pointer-events:auto;width:64px;height:64px;border:none;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .18s,transform .18s;}
.fwm-bigplay svg{width:30px;height:30px;fill:#fff;margin-left:3px;}
.fwm-bigplay.fwm-hidden{opacity:0;transform:scale(.8);pointer-events:none;}
/* 双击 seek 反馈气泡 */
.fwm-seekhint{position:absolute;top:50%;transform:translateY(-50%);padding:8px 14px;border-radius:18px;background:rgba(0,0,0,.55);color:#fff;font-size:14px;font-weight:600;opacity:0;transition:opacity .18s;pointer-events:none;}
.fwm-seekhint-l{left:12%;}.fwm-seekhint-r{right:12%;}
.fwm-seekhint.fwm-show{opacity:1;}
/* 底部控制条 */
.fwm-bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.65));opacity:1;transition:opacity .2s;}
.fwm-bar.fwm-hidden{opacity:0;pointer-events:none;}
.fwm-btn{flex:none;width:34px;height:34px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0;}
.fwm-btn svg{width:21px;height:21px;fill:#fff;}
.fwm-time{flex:none;color:#fff;font-size:12px;font-variant-numeric:tabular-nums;min-width:34px;text-align:center;}
.fwm-prog{flex:1;min-width:60px;height:26px;margin:0;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;}
.fwm-prog::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:rgba(255,255,255,.35);}
.fwm-prog::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;margin-top:-5px;box-shadow:0 0 4px rgba(0,0,0,.5);}
.fwm-prog::-moz-range-track{height:3px;border-radius:2px;background:rgba(255,255,255,.35);}
.fwm-prog::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:#fff;}
/* 加载圈 */
.fwm-spin{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:fwmrot .8s linear infinite;display:none;pointer-events:none;}
.fwm-vid.fwm-loading .fwm-spin{display:block;}
@keyframes fwmrot{to{transform:rotate(360deg);}}
/* ---------- 音频卡（fwm-aud；直边同视频播放器，与详情顶图观感一致） ---------- */
.fwm-aud{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;padding:14px 16px;border-radius:0;background:var(--neu-inset,#D1D9E6);box-shadow:var(--neu-press-sm);}
.fwm-aud-play{flex:none;width:52px;height:52px;border:none;border-radius:50%;background:var(--primary,#5C4033);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.fwm-aud-play svg{width:24px;height:24px;fill:#fff;}
.fwm-aud-main{flex:1;min-width:0;}
.fwm-aud-name{font-size:14px;font-weight:600;color:var(--text-1,#5C4033);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;}
.fwm-aud-row{display:flex;align-items:center;gap:8px;}
.fwm-aud .fwm-time{color:var(--text-3,#9C7E68);min-width:30px;}
.fwm-aud .fwm-prog::-webkit-slider-runnable-track{background:var(--neu-sh-dark,rgba(163,177,198,.5));}
.fwm-aud .fwm-prog::-webkit-slider-thumb{background:var(--primary,#5C4033);box-shadow:none;}
.fwm-aud .fwm-prog::-moz-range-track{background:var(--neu-sh-dark,rgba(163,177,198,.5));}
.fwm-aud .fwm-prog::-moz-range-thumb{background:var(--primary,#5C4033);}
/* 媒体加载失败占位（视频黑底白字 / 音频卡名字行追加），源 404、被删、
   COS 抖动时用户能区分「加载慢」与「已损坏」，不再面对黑箱或点了没反应 */
.fwm-err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);font-size:14px;line-height:1.4;padding:0 16px;box-sizing:border-box;}

.gct{background:#f3f4f6;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
.pv-title.gct-title-link{cursor:pointer;}
.pv-title.gct-title-link:active{opacity:.6;}
/* 标题旁代理信号灯（配色与外接站点在线/离线角标同源）：仅在对方配了代理时出现。 */
.gct-agent-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:middle;}
.gct-agent-dot[data-state="online"]{background:var(--ok);}
.gct-agent-dot[data-state="offline"]{background:var(--danger);box-shadow:0 0 0 2px rgba(229,62,62,.25);}
.gct-msgs{padding:12px 10px;display:flex;flex-direction:column;gap:10px;}
.gct-welcome{text-align:center;color:#9ca3af;font-size:14px;line-height:1.8;padding:40px 20px;}
/* 消息行两侧不展示头像（2026-08 起），气泡直接占满可用宽度，最大化内容展示。
   行内纵向排布（气泡 + 气泡下动作行）：user 行右对齐、peer 行左对齐。 */
.gct-msg{display:flex;flex-direction:column;align-items:flex-start;max-width:100%;}
.gct-msg.user{align-items:flex-end;}
.gct-bubble{max-width:100%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.55;word-break:break-word;white-space:pre-wrap;}
.gct-msg.user .gct-bubble{background:#667eea;color:#fff;border-bottom-right-radius:6px;}
.gct-msg.peer .gct-bubble{background:var(--neu-bg);color:#1f2937;border-bottom-left-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.06);}
.gct-bubble.error{background:#fef2f2;color:#b91c1c;}
/* 乐观发送反馈（pending 气泡）：发送中半透明 + 状态行；失败转红底可点按重发，
   内容随气泡留存（微信式），不再只靠一条浮动提示告知发送失败。 */
.gct-msg.user.gct-pending .gct-bubble{opacity:.6;}
.gct-send-state{font-size:11px;line-height:1.4;margin-top:4px;opacity:.8;text-align:right;}
.gct-msg.gct-failed .gct-bubble{background:#fef2f2;color:#b91c1c;cursor:pointer;border-bottom-right-radius:6px;}
.gct-msg.gct-failed .gct-send-state{color:#b91c1c;font-weight:600;}
/* 气泡动作行（2026-10-11）：每个已落库气泡（不分自己/对方）下方挂
   「编辑 / 引用 / 重发 / 复制」四钮（.gct-act），全部纯客户端行为；
   乐观气泡（pending/failed）不带——失败重发沿用气泡本身的点按重试，
   不与动作行叠两套交互。 */
.gct-actions{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;}
.gct-act{border:none;background:transparent;padding:8px 9px;border-radius:8px;color:#9ca3af;font-size:11px;line-height:1.2;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.gct-act:hover{color:#4b5563;background:rgba(0,0,0,.05);}
.gct-act:active{background:rgba(0,0,0,.08);color:#374151;}
/* 气泡内 Markdown 排版（fillBubbleText 渲染后挂 .gct-md）：紧凑段落 + 基础 code/列表/引用样式。
   气泡默认 white-space:pre-wrap 对 marked 输出的标签间换行会多出空白行，这里改回 normal。 */
.gct-md{white-space:normal;}
.gct-md>:first-child{margin-top:0;}
.gct-md>:last-child{margin-bottom:0;}
.gct-md p{margin:0 0 6px;}
.gct-md h1,.gct-md h2,.gct-md h3,.gct-md h4,.gct-md h5,.gct-md h6{margin:8px 0 4px;font-size:1.05em;line-height:1.4;}
.gct-md ul,.gct-md ol{margin:4px 0;padding-left:20px;}
.gct-md li{margin:2px 0;}
.gct-md code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:rgba(0,0,0,.08);padding:1px 5px;border-radius:4px;word-break:break-all;}
.gct-md pre{background:rgba(0,0,0,.06);border-radius:8px;padding:8px 10px;margin:6px 0;overflow-x:auto;}
.gct-md pre code{background:none;padding:0;}
.gct-msg.user .gct-md code{background:rgba(255,255,255,.22);}
.gct-msg.user .gct-md pre{background:rgba(0,0,0,.18);}
.gct-md blockquote{margin:4px 0;padding:2px 10px;border-left:3px solid rgba(0,0,0,.18);opacity:.85;}
.gct-msg.user .gct-md blockquote{border-left-color:rgba(255,255,255,.5);}
.gct-md a{color:var(--primary);text-decoration:underline;word-break:break-all;}
.gct-msg.user .gct-md a{color:#fff;}
/* 聊天入口零媒体（2026-10-12 用户裁定：聊天窗口不直接出现图片/附件）：
   md.js render() 把 img/video/audio 展平为替代文本，气泡内无媒体元素 */
.gct-md hr{border:none;border-top:1px solid rgba(0,0,0,.12);margin:8px 0;}
/* 表格：gfm 解析 + 窄屏横向滚动（气泡宽度有限，宽表不挤压断行） */
.gct-md table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse;margin:6px 0;font-size:.9em;}
.gct-md th,.gct-md td{border:1px solid rgba(0,0,0,.14);padding:3px 8px;text-align:left;}
.gct-md th{background:rgba(0,0,0,.05);}
/* ==高亮== 扩展（md.js 唯一引擎） */
.gct-md mark{background:#fde68a;color:inherit;padding:0 2px;border-radius:3px;}
/* 任务列表 checkbox 只读（md.js 统一 disabled） */
.gct-md li input[type="checkbox"]{margin-right:6px;}
/* 微信式会话时间分隔条：消息之间间隔超过 5 分钟、或进入会话后第一条消息之前，
   在消息流中插入一条居中的时间戳；单个气泡内不再显示时间。 */
.gct-time-divider{display:flex;justify-content:center;margin:8px 0 4px;}
.gct-time-divider .gct-time-text{background:rgba(120,120,120,.18);color:#4b5563;font-size:11px;line-height:1.5;padding:2px 10px;border-radius:10px;}
/* 文件 chip（附件统一呈现，图片/文件同形）：气泡内按钮块——名称 + 大小，点按经闸读端点下载 */
.gct-file{display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;margin-top:6px;padding:9px 12px;border:1px solid rgba(15,23,42,.14);border-radius:10px;background:rgba(255,255,255,.65);color:#1f2937;font:inherit;font-size:.85rem;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent;}
.gct-msg.user .gct-file{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.4);color:#fff;}
.gct-file:active{opacity:.6;}
.gct-file-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gct-file-size{flex:none;font-size:.72rem;opacity:.75;}`,n.setAttribute("data-rg-owned","1"),document.head.appendChild(n)}function i(){const n=new ai,r=new si(n),a=new ci(n,c),l=new ui(n,a,s,z);function o(){return WorkActionRegistry.me()}function c(B,R,M,Y){const te=String(R??"");if(B==="edit"||B==="quote"){const me=n.inputBar;if(!me||!me.input)return;const ue=me.input;let V;if(B==="edit"?V=te:V=te.split(`

.rc-body{padding:16px 14px 24px;display:flex;flex-direction:column;gap:12px;}
.rc-body .set-card{margin:0;}
.rc-head-text{display:flex;flex-direction:column;min-width:0;}
.rc-chips{display:flex;flex-wrap:wrap;gap:8px;}
.rc-chips .rc-chip{height:auto;max-height:none;min-height:38px;padding:0 14px;font-size:.82rem;}
.rc-chips .rc-chip[aria-pressed="true"]{box-shadow:var(--neu-press-xs)!important;color:var(--ok)!important;font-weight:800;}
.rc-amount-input{margin-top:8px;}
.rc-err{font-size:.8rem;color:var(--danger,#E53E3E);line-height:1.4;}
.rc-err:empty{display:none;}
.rc-actions{display:flex;gap:10px;}
.rc-actions .link-btn{flex:1 1 auto;}
.rc-ledger-btn{width:100%;margin-top:2px;}
.rc-pay-card{padding:20px 16px 18px;text-align:center;}
.rc-pay-title{font-size:1.02rem;font-weight:700;color:var(--primary);margin-bottom:2px;}
.rc-pay-hint{font-size:.82rem;color:var(--text-muted);line-height:1.5;}
/* 无边框二维码：码点直接画在卡面上（无白底板、无圆角、无内边距），
   静区由 QrView 的 quiet 提供；底色透明 => 颜色随主题自动换极性 */
.rc-qr-wrap{display:inline-block;margin:10px 0 12px;line-height:0;}
.rc-qr{width:224px;height:224px;}
.rc-qr:empty{background:var(--neu-inset);border-radius:8px;}
.rc-pay-amount{font-size:.95rem;font-weight:700;color:var(--primary);letter-spacing:.02em;margin-bottom:4px;}
.rc-pay-countdown{font-size:.76rem;color:var(--text-muted);opacity:.85;margin-top:2px;}
.rc-pay-status{font-size:.82rem;color:var(--text-muted);min-height:1.3em;margin-top:10px;}
.rc-pay-status[data-state="paid"]{color:var(--ok);font-weight:700;}
.rc-pay-status[data-state="warn"]{color:var(--danger);}
.rc-pay-actions{display:flex;gap:10px;margin-top:12px;}

.gfp-head{display:flex;align-items:center;gap:11px;background:var(--neu-bg);border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.gfp-head .avatar{width:64px;height:64px;font-size:1.4rem;cursor:zoom-in;}
.gfp-info{flex:1;min-width:0;}
.gfp-name{font-size:20px;font-weight:700;line-height:1.3;display:flex;align-items:center;gap:6px;border-radius:7px;transition:background .15s,color .15s;}
.gfp-name-text{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.gfp-name-real{font-size:13px;font-weight:400;color:var(--text-muted);margin-left:5px;}
.gfp-uname{font-size:13px;color:var(--text-muted);margin-top:2px;}
.gfp-since{font-size:13px;color:var(--text-muted);margin-top:4px;}
.gfp-views{font-size:13px;color:var(--text-muted);margin-top:4px;}

.gfp-actions .gfp-btn{flex:1;min-height:44px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.gfp-btn:disabled{opacity:.5;}
/* 封禁/禁言状态 chip：跟在用户名后 */
.gfp-chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle;flex:0 0 auto;}
.gfp-chip-banned{background:var(--danger-tint);color:var(--danger);}
.gfp-chip-muted{background:#fffaf0;color:#975a16;}
/* 管理菜单「⋯」（viewer_caps = 查看者权限键，服务端仍强制校验） */

.gfp-actions .gfp-admin-wrap .gfp-btn:active{background:var(--neu-bg);}
.gfp-admin-popup{display:none;position:absolute;top:calc(100% + 4px);right:0;width:max-content;min-width:140px;background:var(--neu-bg);border:1px solid var(--border-soft);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);padding:4px 0;z-index:30;}

.gfp-admin-popup button:hover{background:var(--neu-bg);}
.gfp-admin-popup button.danger{color:var(--danger);}
.gfp-section{margin:18px 0 10px;font-size:15px;font-weight:700;color:var(--text-1);}
