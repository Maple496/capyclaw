    - id: ppt-skill-narrative
      name: "dsh-ppt-skill-narrative"
    - id: ppt-skill-design
      name: "dsh-ppt-skill-design"
    - id: ppt-skill-api
      name: "dsh-ppt-skill-api"
    - id: ppt-skill-authoring
      name: "dsh-ppt-skill-authoring"
    - id: ppt-skill-editing
      name: "dsh-ppt-skill-editing"
    - id: ppt-skill-visual-check
      name: "dsh-ppt-skill-visual-check"
    - id: ppt-skill-research
      name: "dsh-ppt-skill-research"
